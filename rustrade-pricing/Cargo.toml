[package]
name = "rustrade-pricing"
version = "0.22.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/rustrade-pricing"
readme = "README.md"
description = "Option pricing models for Rustrade: American and European price, implied volatility and Greeks."

[dependencies]
# Rustrade Ecosystem
rustrade-instrument = { workspace = true }

# Pure-Rust maths (exp, ln, erfc), so results are bit-identical on every platform rather than
# depending on the platform's C maths library.
libm = { version = "0.2.16" }

# Misc
chrono = { workspace = true }
thiserror = { workspace = true }
