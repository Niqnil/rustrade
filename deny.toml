# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# Advisories - handled by cargo audit job, but deny can also check
[advisories]
ignore = [
    # paste is a build-time proc-macro (no code shipped into the binary), archived upstream with
    # no vulnerability and no safe upgrade. Transitive via parquet 59.1.0 (latest) -> rustrade-data
    # `lse-parquet`. Revisit if arrow-rs migrates to `pastey`.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; build-time proc-macro, transitive via parquet; no upgrade available" },

    # rand unsoundness requires the `log` feature + a custom logger that itself draws from
    # `rand::rng()` + a reseed. The `log` feature is not enabled anywhere in this workspace, so the
    # precondition cannot be met. Still live against the committed lockfile, which carries rand
    # 0.8.5 and 0.9.2 (patched: 0.8.6 / 0.9.3) transitively via tungstenite and proptest.
    # quinn-proto is NOT a source: since the 0.11.16 bump it pulls rand 0.10.2, which is unaffected.
    # Drop this entry only once `cargo audit` against `Cargo.lock` stops reporting it.
    { id = "RUSTSEC-2026-0097", reason = "rand's log feature not enabled in this workspace (required for vulnerability)" },

    # rkyv is an *unenabled optional* dependency of rust_decimal (gated behind its `rkyv` feature,
    # which nothing here enables). It is in Cargo.lock only because the lockfile is feature-agnostic
    # and records every optional dep; `cargo tree -i rkyv --workspace --all-features --target all`
    # finds no path to it, and cargo deny's feature-aware graph does not flag it -- only cargo audit,
    # which reads the lockfile directly. Same phantom-lockfile mechanism as RUSTSEC-2026-0097 above.
    # No upgrade exists: rust_decimal 1.42.1 pins rkyv ^0.7.46 and upstream declared 0.7 unsupported
    # (no backport, unlike RUSTSEC-2026-0001). Drop this entry once rust_decimal drops rkyv 0.7
    # (paupino/rust-decimal#819) or moves to rkyv >=0.8.17.
    { id = "RUSTSEC-2026-0235", reason = "rkyv is an unenabled optional dep of rust_decimal; never compiled in this workspace" },

    # hyperliquid_rust_sdk transitive dependencies (no direct control)
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained; transitive via hyperliquid_rust_sdk" },
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; transitive via hyperliquid_rust_sdk" },
    { id = "RUSTSEC-2025-0009", reason = "ring AES panic; transitive via hyperliquid_rust_sdk; overflow checks disabled in release" },
    { id = "RUSTSEC-2025-0010", reason = "ring < 0.17 unmaintained; transitive via hyperliquid_rust_sdk" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive via hyperliquid_rust_sdk" },
    { id = "RUSTSEC-2026-0098", reason = "webpki URI name constraints; transitive via hyperliquid_rust_sdk; low impact for API client" },
    { id = "RUSTSEC-2026-0099", reason = "webpki wildcard name constraints; transitive via hyperliquid_rust_sdk; low impact for API client" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki CRL panic; transitive via hyperliquid_rust_sdk; CRLs not used" },

    # h2 queues empty DATA frames without limit (low-severity DoS: unbounded memory, or a panic if
    # the length overflows). Two instances were in the lockfile; only one is ours to fix:
    #   * h2 0.4.x, via hyper 1.x / reqwest 0.12 -- FIXED, bumped to 0.4.19 (patched >= 0.4.16).
    #   * h2 0.3.27, kept here. Upstream shipped the fix only on the 0.4 line, so no patched 0.3.x
    #     exists and no bump is available to us. Every path to it runs through the `hyperliquid`
    #     feature -- hyperliquid_rust_sdk 0.6 and our own optional ethers 2.0, both gated on it --
    #     then reqwest 0.11 -> hyper 0.14, so it is not compiled under the default feature set.
    # NOTE: cargo-deny's [advisories.ignore] takes only `id`/`reason`, so this suppression cannot be
    # scoped to the 0.3 line -- it silences this advisory for h2 0.4.x too. Cargo.lock therefore
    # pins the 0.4 line forward at 0.4.19, and that pin is the thing protecting us there, not this
    # gate. Re-check the 0.4 entry in Cargo.lock if h2 is ever downgraded or re-resolved.
    # Drop this entry once hyperliquid_rust_sdk and ethers move off reqwest 0.11.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3 has no patched release; reached only via the hyperliquid feature (hyperliquid_rust_sdk/ethers -> reqwest 0.11 -> hyper 0.14)" },
]

# Licenses - strict permissive only
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

# hyperliquid_rust_sdk transitive dependencies with non-standard licenses
# tiny-keccak: CC0-1.0 is public domain; transitive via hyperliquid_rust_sdk
# webpki-roots: MPL-2.0 is permissive for linking; Mozilla root certs; transitive via hyperliquid_rust_sdk
exceptions = [
    { name = "tiny-keccak", allow = ["CC0-1.0"] },
    { name = "webpki-roots", allow = ["MPL-2.0"] },
]

# ring 0.17.x: Cargo.toml declares "Apache-2.0 AND ISC", both allowlisted.
# ring 0.16.x: Used by hyperliquid_rust_sdk; has LICENSE files but no Cargo.toml field.
[[licenses.clarify]]
name = "ring"
version = "0.16.20"
expression = "ISC AND MIT"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# Bans - minimal, rely on review process instead
#
# openssl / openssl-sys are still in the tree: `openssl 0.10.81` arrives via binance-sdk and via
# native-tls (itself pulled by ethers' reqwest 0.11). The workspace itself uses rustls-tls, so this
# is transitive-only and unconfigured by us. No `[[bans.skip]]` entry is needed while
# `multiple-versions = "warn"` and only one version resolves -- a skip would be inert config
# claiming to do something. Recorded here instead so the review trigger survives: re-check on
# binance-sdk upgrades, and add skips if `multiple-versions` is ever raised to "deny".
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# The `arrow` stack must never enter the graph.
#
# `rustrade-data`'s optional `parquet` dependency is `default-features = false` precisely because
# its defaults pull `arrow-array`/`buffer`/`data`/`schema`/`select`/`ipc` plus `base64`, `brotli`,
# `flate2`, `lz4`, `snap` and `simdutf8`. The LSE export decoder reads Parquet through the column
# API and needs none of it, and that exclusion is the whole supply-chain case for accepting
# `parquet` at all (see `.github/tier2-dependencies.txt`).
#
# Until now that invariant lived only in comments, which nothing checks. Cargo unifies features
# workspace-wide, so *any* future dependency pulling `parquet` with defaults re-admits the lot
# silently. These entries make `cargo deny` fail the moment it happens. If arrow ever becomes a
# deliberate dependency, that is a tier-2 review, and removing these lines is how it is recorded.
deny = [
    { name = "arrow" },
    { name = "arrow-array" },
    { name = "arrow-buffer" },
    { name = "arrow-schema" },
]

# Sources - only allow crates.io
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
