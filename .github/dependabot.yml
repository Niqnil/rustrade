# Dependabot configuration for rustrade
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

# Every entry holds back a release until it is 7 days old. Most malicious releases are found and
# pulled within hours of publication, so a week skips them, which matters most for the patch
# updates dependabot-auto-merge.yml merges without review. The cooldown applies to version updates
# only: security updates still open at once. A fix needed sooner can be bumped by hand.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
    groups:
      rust-patch:
        update-types:
          - "patch"
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-patch:
        update-types:
          - "patch"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7

  # Proposes each new Rust release for rust-toolchain.toml. Fix any lints the new release adds in
  # that PR, so they never land in unrelated ones. Point releases (1.x.y -> 1.x.y+1) are patch
  # updates, which dependabot-auto-merge.yml merges once CI passes; minor releases stay manual.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    rebase-strategy: "disabled"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
