name: "Dependabot Auto-Merge"

on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
    branches:
      - develop

# A later event on the same PR replaces this run, including its wait for the merge below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge patch updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch ci.yml after the merge
    if: github.actor == 'dependabot[bot]'
    # Most of this is the wait for the merge, bounded at 60 minutes in its own step.
    timeout-minutes: 70
    steps:
      - name: Checkout for tier-2 config
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/tier2-dependencies.txt
          sparse-checkout-cone-mode: false

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for tier-2 dependencies
        id: tier2-check
        env:
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          # Read tier-2 list: extract crate names only (strip =version and # comments)
          if [ -f .github/tier2-dependencies.txt ]; then
            TIER2_DEPS=$(grep -v '^#' .github/tier2-dependencies.txt \
              | grep -v '^$' \
              | sed 's/=.*//' \
              | sed 's/[[:space:]].*//' \
              | sort -u \
              | tr '\n' '|' \
              | sed 's/|$//')
            # Word-boundary matching: DEP_NAMES is comma-separated from fetch-metadata
            if [ -n "$TIER2_DEPS" ] && echo "$DEP_NAMES" | grep -qE "(^|, )($TIER2_DEPS)(,|$)"; then
              echo "match=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Tier-2 dependency detected: requires manual review"
            fi
          fi

      - name: Add tier-2 label for high-risk dependencies
        if: steps.tier2-check.outputs.match == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "$PR_URL" --add-label "tier-2"

      - name: Disable auto-merge for tier-2 dependencies
        if: |
          contains(github.event.pull_request.labels.*.name, 'tier-2') ||
          steps.tier2-check.outputs.match == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --disable-auto "$PR_URL" || true

      - name: Auto-merge patch updates
        id: auto-merge
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          !contains(github.event.pull_request.labels.*.name, 'tier-2') &&
          steps.tier2-check.outputs.match != 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"

      # The merge above is made with GITHUB_TOKEN, and events GITHUB_TOKEN causes trigger no
      # workflows, so ci.yml's `push` run never happens for the squash commit on develop. The PR's
      # own run tested its head against an older develop, not the merge result. Wait for the merge,
      # then dispatch ci.yml on develop, which GITHUB_TOKEN is allowed to do.
      - name: Run CI on develop after the merge
        if: steps.auto-merge.outcome == 'success'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deadline=$(( $(date +%s) + 60 * 60 ))
          while :; do
            state=$(gh pr view "$PR_URL" --json state --jq .state)
            case "$state" in
              MERGED)
                gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref develop
                echo "::notice::Merged; dispatched CI on develop"
                exit 0
                ;;
              CLOSED)
                echo "::notice::Closed without merging; no CI to dispatch"
                exit 0
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Not merged within 60 minutes, so CI was not dispatched on develop. If it merges later, run ci.yml on develop by hand."
              exit 1
            fi
            sleep 30
          done
