name: "Publish to crates.io"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Read-only by default: `validate` runs every dependency's build script, and none of them should
# hold a token that can write to this repository. `publish` widens this for itself below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MOLD_VERSION: "2.35.1"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `cargo test` step is ci.yml's `--all-features` workspace test build less its examples, so
    # it hits the same memory limit: with full debug info, its final parallel compile runs the
    # 16 GB runner out of memory and the job is killed with exit 143 (#385). That failed the v0.7.0
    # validation. Line tables are what ci.yml builds with; see the note on that job.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # Every action is pinned to the same commit as in ci.yml, so a release runs the code CI
      # exercised, and Dependabot bumps both files together.
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444  # v1
        with:
          mold-version: ${{ env.MOLD_VERSION }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy

      # Fails in seconds on a tag that does not match every crate's version, before the tests run
      # rather than after them. The publish step checks again, since it can be re-run on its own.
      - name: Check the tag matches every crate version
        run: ./.github/scripts/publish-crates.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DRY_RUN: "1"

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious -D clippy::style -W clippy::complexity -D clippy::perf

      - name: Run cargo test
        run: cargo test --locked --workspace --all-features --lib --bins --tests

  publish:
    name: Publish crates
    needs: validate
    runs-on: ubuntu-latest
    # Comfortably above the expected total, even with every crate slow to reach the index, so the
    # script's own timeout error fires before the job is killed
    timeout-minutes: 45
    # Each crate's trusted publisher on crates.io names this repository, `publish.yml` and this
    # environment, so only this job can obtain a publish token. The environment's deployment rules
    # restrict it to `v*` tags.
    environment: release
    permissions:
      contents: write  # create the GitHub Release
      id-token: write  # exchange the job's OIDC token for a crates.io publish token
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      # Trusted publishing: no long-lived crates.io token exists. The token this returns expires
      # after 30 minutes and is revoked when the job ends. A publish that outlasts it (every crate
      # slow to reach the index) fails, and a re-run resumes with a fresh token.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      # Publishes in dependency order, waits for each crate to reach the index before the next, and
      # skips any version already there, so a re-run resumes where a failed one stopped. The order,
      # the index check and the barrier are explained at the top of the script.
      - name: Publish crates
        run: ./.github/scripts/publish-crates.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # `gh` is preinstalled on the runner, so no third-party action runs with a write token.
      - name: Create GitHub Release
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
