name: "Fee Schedule Weekly"

# Detects a change to a venue's published fee schedule, and opens an issue when one is found.
#
# The simulated venue's fee models and their rustdoc examples follow a venue's schedule as of a
# date, and venues revise their schedules without notice. Each run downloads the document, extracts
# its text and compares its revision date and a checksum of its words with the baseline in
# `.github/fee-schedules/`. The schedule's text is never committed (it is the venue's document);
# each run on the default branch keeps it as an artifact for 90 days instead, so a change is shown
# as a diff against the text of an earlier run that matched the baseline.
#
# Updating the baseline: set `revised` and `words_sha256` to the values the issue gives (or that
# `.github/scripts/fee-schedule.sh check` prints), after checking what follows the schedule.

on:
  schedule:
    # Monday 06:17 UTC. Any time works: the document has no market hours.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # A change to the check or its baseline is checked against the live document before it merges,
  # so a baseline update cannot land wrong and a script change cannot land broken.
  pull_request:
    branches: [develop, main]
    paths:
      - ".github/workflows/fee-schedule-weekly.yml"
      - ".github/scripts/fee-schedule.sh"
      - ".github/fee-schedules/**"

# The runs that open issues are serialised, since two at once could each open one for the same
# change. Pull request runs get a group of their own, so a pending one never displaces a pending
# scheduled run (a group keeps only its newest pending run).
concurrency:
  group: >-
    fee-schedule-weekly-${{ github.event_name == 'pull_request' && github.ref || 'reporting' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alpaca:
    name: Alpaca fee schedule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Finds and downloads an earlier run's extracted text.
      actions: read
      # Opens the issue reporting a change.
      issues: write
    env:
      BASELINE: .github/fee-schedules/alpaca.json
      ARTIFACT: fee-schedule-text-alpaca
      OUT: fee-schedule-out
      # Only a run on the default branch keeps its text and opens issues. A scheduled run always
      # is one; a manual run is one when dispatched there. Any other run (a pull request, a manual
      # run on another branch) fails instead when its baseline does not match the document.
      REPORTING: >-
        ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
        && github.ref_name == github.event.repository.default_branch) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install pdftotext
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          pdftotext -v 2>&1 | head -n 1

      - name: Compare the document with the baseline
        id: check
        run: .github/scripts/fee-schedule.sh check "$BASELINE" "$OUT"

      - name: Keep the extracted text for a later run's diff
        if: env.REPORTING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.OUT }}/fee-schedule.txt
          retention-days: 90
          if-no-files-found: error

      - name: Report an unchanged document
        if: steps.check.outputs.changed == 'false'
        env:
          REVISED: ${{ steps.check.outputs.revised }}
        run: echo "Alpaca fee schedule unchanged (revised $REVISED)." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail a run whose baseline does not match the document
        if: steps.check.outputs.changed == 'true' && env.REPORTING != 'true'
        env:
          REVISED: ${{ steps.check.outputs.revised }}
          WORDS_SHA256: ${{ steps.check.outputs.words_sha256 }}
        run: |
          echo "::error::$BASELINE does not match the live document. If the document changed," \
               "check what follows it, then set revised to \"$REVISED\" and words_sha256 to" \
               "\"$WORDS_SHA256\"."
          exit 1

      - name: Open an issue for a changed document
        if: steps.check.outputs.changed == 'true' && env.REPORTING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Diff against the most recent earlier run whose text matched the baseline, so the diff
          # shows everything the baseline is missing. Failing that, against the most recent
          # earlier run that still has its text (each keeps it 90 days).
          base_sha=$(jq -r .words_sha256 "$BASELINE")
          prev=""
          desc=""
          runs=$(gh run list --repo "$REPO" --workflow fee-schedule-weekly.yml \
            --branch "$BRANCH" --status success --limit 30 --json databaseId,event \
            --jq '.[] | select(.event != "pull_request") | .databaseId')
          for id in $runs; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            dir="$RUNNER_TEMP/previous-$id"
            # A failure is logged, not hidden: an expired artifact and an API error both end here.
            if ! gh run download "$id" --repo "$REPO" --name "$ARTIFACT" --dir "$dir"; then
              continue
            fi
            day=$(gh run view "$id" --repo "$REPO" --json createdAt --jq '.createdAt[0:10]')
            if [ -z "$prev" ]; then
              prev="$dir/fee-schedule.txt"
              desc="the text run $id saw on $day"
            fi
            if [ "$(.github/scripts/fee-schedule.sh words-sha256 "$dir/fee-schedule.txt")" \
                 = "$base_sha" ]; then
              prev="$dir/fee-schedule.txt"
              desc="the text run $id saw on $day"
              break
            fi
          done

          if [ -n "$prev" ]; then
            .github/scripts/fee-schedule.sh report "$BASELINE" "$OUT" "$prev" "$desc"
          else
            .github/scripts/fee-schedule.sh report "$BASELINE" "$OUT"
          fi
          cat "$OUT/issue.md" >> "$GITHUB_STEP_SUMMARY"

          # One issue per version of the document, open or closed: its title carries the new
          # checksum. Closed ones count because a baseline update merged into the development
          # branch reaches this branch only at the next release; until then each run here still
          # sees the change.
          title=$(cat "$OUT/title.txt")
          words_sha256=$(sed -n 's/^words_sha256=//p' "$OUT/result.env")
          titles=$(gh issue list --repo "$REPO" --state all --limit 100 \
            --search "${words_sha256:0:12} in:title" --json title --jq '.[].title')
          if grep -qxF -- "$title" <<<"$titles"; then
            echo "An issue already reports this version: $title"
          else
            gh issue create --repo "$REPO" --title "$title" --body-file "$OUT/issue.md"
          fi
