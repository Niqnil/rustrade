name: "Alpaca Integration"

on:
  push:
    paths-ignore:
      - "**.md"
    branches: ["main", "develop"]
  pull_request:
    paths-ignore:
      - "**.md"
    branches: ["main", "develop"]

concurrency:
  # Keyed on the ACCOUNT, not the ref. These workflows share one Alpaca paper account, so two runs
  # that overlap contend for it: one hits "connection limit exceeded" on the market-data stream
  # while the other trips "cannot open a long buy while a short sell order is open" on a resting
  # order it did not place. Keying on `github.ref` put a `develop` push and an open PR in different
  # groups, so they never excluded each other -- and since this fires on both `push: develop` and
  # `pull_request`, merging anything while a PR was open reliably overlapped.
  #
  # `cancel-in-progress: false` matters as much as the constant group: cancelling a run mid-test can
  # leave a resting order behind that poisons the next one.
  group: alpaca-paper-account
  cancel-in-progress: false

env:
  MOLD_VERSION: "2.35.1"
  ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  ALPACA_PAPER: "true"

jobs:
  alpaca-tests:
    name: Alpaca integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run on same-repo PRs and pushes (prevents secret exfiltration from forks)
    if: |
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install mold linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444  # v1
        with:
          mold-version: ${{ env.MOLD_VERSION }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: "rustrade-ci-test"

      - name: Execution tests
        id: exec-tests
        continue-on-error: true
        run: cargo test --locked -p rustrade-execution --features alpaca --test alpaca_integration -- --ignored

      - name: Market data tests (skip IEX, SIP, OPRA)
        id: data-tests
        continue-on-error: true
        run: cargo test --locked -p rustrade-data --features alpaca --test alpaca_data -- --ignored --skip iex --skip sip --skip opra

      - name: Check test results
        if: steps.exec-tests.outcome == 'failure' || steps.data-tests.outcome == 'failure'
        run: exit 1
