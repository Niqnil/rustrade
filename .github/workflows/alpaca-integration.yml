name: "Alpaca Integration"

on:
  push:
    paths-ignore:
      - "**.md"
    branches: ["main", "develop"]
  pull_request:
    paths-ignore:
      - "**.md"
    branches: ["main", "develop"]

# Read-only: the tests only need the checkout.
permissions:
  contents: read

env:
  MOLD_VERSION: "2.35.1"
  ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
  ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
  ALPACA_PAPER: "true"

jobs:
  alpaca-tests:
    name: Alpaca integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # Keyed on the ACCOUNT, not the ref. These workflows share one Alpaca paper account, so two
      # runs that overlap contend for it: one hits "connection limit exceeded" on the market-data
      # stream while the other trips "cannot open a long buy while a short sell order is open" on a
      # resting order it did not place. Keying on `github.ref` put a `develop` push and an open PR
      # in different groups, so they never excluded each other -- and since this fires on both
      # `push: develop` and `pull_request`, merging anything while a PR was open reliably
      # overlapped.
      #
      # `cancel-in-progress: false` matters as much as the constant group: cancelling a run mid-test
      # can leave a resting order behind that poisons the next one.
      #
      # Set on the JOB, not the workflow, so a job skipped by the `if:` below never enters the
      # group. At workflow level a Dependabot run still queued in it, and a newer entrant replaces
      # an older PENDING one -- so a batch of Dependabot PRs cancelled real runs waiting for the
      # account. Groups are repository-wide at either level, so `alpaca-weekly.yml` still excludes
      # this job.
      group: alpaca-paper-account
      cancel-in-progress: false
    # Only run on same-repo PRs and pushes (prevents secret exfiltration from forks).
    #
    # Skip runs Dependabot triggers. GitHub hands those the Dependabot secret store, not the Actions
    # one, so ALPACA_API_KEY / ALPACA_SECRET_KEY arrive empty and every test fails `unauthorized`
    # -- a red check that says nothing about the bump. Keeping the paper-account keys out of that
    # store is deliberate: a Dependabot run executes the new dependency's code. A human push to a
    # Dependabot branch still runs these tests, with the real secrets. After merge, coverage depends
    # on who merged: a human merge triggers the `push` run on develop, but an auto-merged patch bump
    # lands through GITHUB_TOKEN, which triggers no workflow at all -- such a bump is first exercised
    # by the next push to develop or by `alpaca-weekly.yml`.
    if: |
      github.actor != 'dependabot[bot]' && (
        github.event_name == 'push' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install mold linker
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621  # v1
        with:
          mold-version: ${{ env.MOLD_VERSION }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: "rustrade-ci-test"

      - name: Execution tests
        id: exec-tests
        continue-on-error: true
        run: cargo test --locked -p rustrade-execution --features alpaca --test alpaca_integration -- --ignored

      - name: Market data tests (skip IEX, SIP, OPRA)
        id: data-tests
        continue-on-error: true
        run: cargo test --locked -p rustrade-data --features alpaca --test alpaca_data -- --ignored --skip iex --skip sip --skip opra

      - name: Check test results
        if: steps.exec-tests.outcome == 'failure' || steps.data-tests.outcome == 'failure'
        run: exit 1
