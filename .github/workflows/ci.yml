name: "rustrade CI"

on:
  # Branch protection does not gate on push runs, so a Markdown-only push can skip the workflow
  # outright.
  push:
    paths-ignore:
      - "**.md"
    branches: ["main", "develop"]
  # No `paths-ignore` here: a filtered-out workflow never starts, so a Markdown-only PR would wait
  # forever on required checks that never report. The `changes` job below skips the work instead,
  # and a job skipped by its `if:` reports as passed.
  pull_request:
    branches: ["main", "develop"]
  # Dispatched by `dependabot-auto-merge.yml` once it has merged a PR: a merge made with
  # GITHUB_TOKEN triggers no `push` run, but GITHUB_TOKEN may dispatch one.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default: jobs here compile third-party code (build scripts, proc macros), which
# should not hold a token that can write to this repository. `audit` widens this for itself below.
permissions:
  contents: read

env:
  MOLD_VERSION: "2.35.1"

jobs:
  # Decides whether a PR changes anything besides Markdown. Every other job gates on it, and the
  # gate fails closed: a job skips only when this one succeeded *and* reported `code=false`. If it
  # fails at any point, even after writing its output, everything runs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # On `pull_request`, checkout lands on the test merge commit, whose first parent is the base
      # branch tip. Depth 2 fetches that parent, so the diff below is exactly what the PR merges.
      - name: Checkout sources
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      # `push` is already filtered by `paths-ignore`, and a dispatch has no diff to classify.
      # `--no-renames` lists both sides of a rename, so renaming `x.rs` to `x.md` counts as code.
      # The `HEAD^2` check refuses to diff a non-merge commit, whose first parent would cover only
      # the PR's last commit.
      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rev-parse --verify --quiet HEAD^2 > /dev/null
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          # Only a path that matches `*.md` can keep `code` false, so an empty diff counts as code.
          code=false
          while IFS= read -r path; do
            # Indented so that a path starting with `::` is not parsed as a workflow command.
            printf '  %s\n' "$path"
            case $path in
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          if [ "$code" = false ]; then
            echo "Markdown-only change: skipping every check" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  fmt:
    name: cargo fmt
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  tier2-pins:
    name: tier-2 pins
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Only `cargo metadata --no-deps` is run, which reads the workspace manifests without
      # resolving or building anything -- no toolchain components and no network are needed.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Check tier-2 pins match the record
        run: ./.github/scripts/check-tier2-pins.sh

  check:
    name: cargo check
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install mold linker
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36  # v1
        with:
          mold-version: ${{ env.MOLD_VERSION }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: "rustrade-ci-check"

      - name: Run cargo check
        run: cargo check --locked --workspace --all-targets --all-features

      # Every other job runs --all-features, so a missing `#[cfg(feature = ...)]` on an optional
      # integration would ship green. These pin the claim that the integrations are genuinely
      # optional: the default build must not require them.
      - name: Run cargo check (no default features)
        run: |
          cargo check --locked -p rustrade-data --no-default-features
          cargo check --locked -p rustrade-execution --no-default-features

  test:
    name: cargo test
    needs: [fmt, check]
    # Explicit, because the implicit `success()` also looks at `changes`, an ancestor: if that job
    # failed, this one would be skipped -- and a skip passes a required check -- even though `fmt`
    # and `check` ran and passed. On a Markdown-only PR both are skipped, so this skips too.
    # `clippy` and `docs` use the same gate.
    if: ${{ !cancelled() && needs.fmt.result == 'success' && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    # This job debug-builds the whole workspace with `--all-features` (ethers, aws-lc-sys, ring and
    # every exchange SDK) and then runs both `--lib --bins --tests` and the doc-tests against that
    # one build. Observed wall-clock on a warm cache is 11m35s-14m20s, so a 15-minute budget left
    # as little as 40 seconds of headroom. Any `Cargo.lock` change invalidates the cache, and a
    # cold build then runs past the limit: the job is cancelled, and a cancellation reports as a
    # red required check that is indistinguishable from a genuine test failure at a glance. That
    # blocks otherwise-good dependency PRs and costs a full re-run to diagnose.
    #
    # 25 minutes keeps a real hang bounded while leaving room for a cold cache. Revisit if the
    # warm-cache figure climbs far enough to erode the margin again.
    timeout-minutes: 25
    # Line tables keep file:line in backtraces for less disk and memory than full debug info.
    # They were adopted when the `rustrade-data` library compiled at up to 13 GB in one rustc
    # process on this 16 GB runner, almost all of it debug info, and the job was intermittently
    # killed with exit 143 (#385). Type-erasing the market stream's reconnect chain (#387) brought
    # that compile under 2 GB at full debug (measured locally), so they should now be a saving
    # rather than what keeps the job alive. This is a profile setting, not a rustflag, so
    # `.cargo/config.toml`'s mold and `split-debuginfo` flags still apply.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The `--all-features` debug build + link of the whole workspace (ethers,
      # aws-lc-sys, ring, the exchange SDKs, ...) can exhaust the runner's disk
      # ("No space left on device" during the mold link step). Reclaim ~12 GB of
      # preinstalled toolchains we never use instead of adding a third-party action.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install mold linker
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36  # v1
        with:
          mold-version: ${{ env.MOLD_VERSION }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: "rustrade-ci-test"

      - name: Run cargo test
        # `--examples` links the example binaries rather than only type-checking them.
        # `.cargo/config.toml` sets `-C split-debuginfo=unpacked`, which keeps their debug info
        # out of the linked binaries.
        #
        # This step has been intermittently killed with exit 143 (SIGTERM) during the final
        # parallel compile-and-link of the `rustrade` crate. The kill ends the whole job, skipping
        # every later step including `if: always()` ones, so the sampler runs inside this step and
        # prints as it goes: whatever it saw before the kill is already in the log.
        run: |
          .github/scripts/sample-memory.sh 5 "$RUNNER_TEMP/mem.log" &
          sampler=$!
          trap 'kill "$sampler"' EXIT
          cargo test --locked --workspace --all-features --lib --bins --tests --examples

      # The target list above excludes doc-tests, so without this step a rustdoc example
      # that no longer compiles ships green. Separate from the step above so a failure here is
      # attributable at a glance; it reuses that step's build.
      - name: Run doc-tests
        run: cargo test --locked --workspace --all-features --doc

      # Put the build's peak in the job summary, so the headroom on runs that survive is on record
      # alongside the kills. A killed run never reaches this step; its samples are in the log above.
      - name: Memory peak
        if: always()
        run: |
          record="$RUNNER_TEMP/mem.log"
          # `|| true`: the step shell runs with `-e -o pipefail`, and a failure before the sampler
          # started leaves no record.
          peak=$(grep -o 'used=[0-9]*' "$record" 2>/dev/null | cut -d= -f2 | sort -n | tail -1 || true)
          low=$(grep -o 'avail=[0-9]*' "$record" 2>/dev/null | cut -d= -f2 | sort -n | head -1 || true)
          echo "Build memory: peak used ${peak:-?} MB, lowest available ${low:-?} MB, of $(free -m | awk 'NR==2 {print $2}') MB" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  clippy:
    name: cargo clippy
    needs: [fmt, check]
    if: ${{ !cancelled() && needs.fmt.result == 'success' && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install mold linker  # Required for proc-macro linking on cache miss
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36  # v1
        with:
          mold-version: ${{ env.MOLD_VERSION }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: "rustrade-ci-check"

      - name: Run cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious -D clippy::style -W clippy::complexity -D clippy::perf

  docs:
    name: cargo doc
    needs: [fmt, check]
    if: ${{ !cancelled() && needs.fmt.result == 'success' && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install mold linker  # Required for proc-macro linking on cache miss
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36  # v1
        with:
          mold-version: ${{ env.MOLD_VERSION }}

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: "rustrade-ci-check"

      # Nothing else compiles rustdoc's link graph, so a doc link that stops resolving ships green
      # and renders as dead text on docs.rs -- which is how six of them accumulated before this job
      # existed. All three lints are warn-by-default, so denying them here is what makes them a gate.
      # `--all-features` is load-bearing: `rustrade-execution` has `default = []` with every client
      # feature-gated, so a bare `cargo doc` would document none of that code and pass vacuously.
      - name: Check rustdoc links
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::private_intra_doc_links
            -D rustdoc::redundant_explicit_links
            -D rustdoc::invalid_html_tags
        run: cargo doc --locked --workspace --all-features --no-deps

      # The public build above renders no private item's docs, so a broken link in one ships green.
      # This second pass documents private items too. It cannot replace the first:
      # `private_intra_doc_links` fires only without `--document-private-items`, so only the first
      # catches a public doc linking to a private item.
      - name: Check rustdoc links on private items
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::redundant_explicit_links
            -D rustdoc::invalid_html_tags
        run: cargo doc --locked --workspace --all-features --no-deps --document-private-items

  # Mutation-tests the lines this PR changes. cargo-mutants alters each one (a `<` to `<=`, a
  # function body to `Default::default()`, ...) and reruns the tests of the mutated crate; a mutant
  # they still pass on marks behaviour no test in that crate pins. cargo-mutants itself annotates
  # missed mutants on their lines when it runs under GitHub Actions, and each shard's job summary
  # lists all of its own.
  #
  # Informational: not a required check, and a missed mutant or a timeout leaves it green. It fails
  # only when the run itself does, for example when the tests already fail without any mutation.
  # See CONTRIBUTING.md, "Mutation testing".
  #
  # The mutants are split across parallel shards, each a job of its own. A job tests one mutant at
  # a time, at roughly 30 s each (more on a slow runner), after about 5 minutes of setup, so on a
  # slow runner a single job ran out of time at about 60. Three shards fit about 180 even there.
  # Each shard repeats the setup, so add one only when diffs outgrow that.
  mutants:
    name: cargo mutants (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [fmt, check]
    # Only a PR has a diff to scope the run to. The rest is `test`'s gate.
    if: ${{ github.event_name == 'pull_request' && !cancelled() && needs.fmt.result == 'success' && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]  # cargo-mutants numbers shards from 0
    # Must match `test`'s `env` exactly. The cache restored below is `test`'s, and rust-cache hashes
    # `CARGO_*` variables into its key, so any difference here misses it.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # Depth 2 fetches the base branch tip, the test merge commit's first parent; see `changes`.
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      # cargo-mutants mutates only the sources of library and binary targets, never `tests/`,
      # `examples/` or `benches/`, so a PR that changes no `src/` has nothing to mutate and every
      # step below skips. The diff is cut to the same files: a binary file, a mode change or a rename
      # elsewhere could otherwise make it unparseable. In a pathspec `*` also matches `/`, so this
      # covers nested modules. The `HEAD^2` check is the same guard as in `changes`.
      - name: Extract the PR's diff
        id: diff
        run: |
          git rev-parse --verify --quiet HEAD^2 > /dev/null
          git diff --no-renames HEAD^1 HEAD -- '*/src/*.rs' > "$RUNNER_TEMP/pr.diff"
          if [ -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "No crate source changed: nothing to mutate" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Free disk space  # As in `test`, which builds the same targets
        if: steps.diff.outputs.rust == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install mold linker
        if: steps.diff.outputs.rust == 'true'
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36  # v1
        with:
          mold-version: ${{ env.MOLD_VERSION }}

      - name: Install stable toolchain
        if: steps.diff.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      # `test`'s cache, restored read-only. This job runs only on PRs, and a PR run can save a cache
      # only to its own ref, so a cache of this job's own would start cold on every new PR. `test`
      # saves one on every push to `develop`, and this job takes no share of the cache quota.
      #
      # The reuse is partial. cargo-mutants builds with `--package=<mutated crate>`, not
      # `--workspace`, which unifies some dependencies' features differently, so each run first
      # rebuilds those: 84 crates for `rustrade-execution` and 95 for `rustrade`, measured locally.
      # `--test-workspace` would hit the cache in full, but then every mutant rebuilds and tests
      # every crate that depends on its own.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        if: steps.diff.outputs.rust == 'true'
        with:
          shared-key: "rustrade-ci-test"
          save-if: false

      # Compiled on every run, since the cache above is never saved.
      - name: Install cargo-mutants
        if: steps.diff.outputs.rust == 'true'
        run: cargo install --locked cargo-mutants@27.1.0

      # - `--in-place` mutates this checkout rather than a copy, so the build reuses the restored
      #   `target/` without copying it. That runs one mutant at a time, and is safe only because the
      #   runner is discarded afterwards: never pass it locally.
      # - `--profile=test` replaces `.cargo/mutants.toml`'s local-only profile with the one `test`
      #   built the cache under.
      # - The targets go in `--cargo-arg`, not after `--`: cargo-mutants passes trailing arguments
      #   to the test phase only, and its build phase would then link every example too.
      # - `--shard` takes this job's share of the mutants. Round-robin deals them out one at a time,
      #   so the slow ones, which cluster (a mutant that makes a wait loop spin times out, and so
      #   do its neighbours on the same line), spread across the shards.
      # - `timeout` interrupts the run with time left in the job, so a large PR still gets a summary
      #   of the mutants tested so far. cargo-mutants records each outcome as it lands.
      - name: Run cargo mutants
        id: mutants
        if: steps.diff.outputs.rust == 'true'
        run: |
          status=0
          timeout --signal=INT --kill-after=2m 40m \
            cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --in-place --profile=test \
              --cargo-arg=--locked --cargo-arg=--lib --cargo-arg=--bins --cargo-arg=--tests \
              --shard "${{ matrix.shard }}/${{ strategy.job-total }}" --sharding round-robin \
              --output "$RUNNER_TEMP" \
            || status=$?
          # 2: a mutant was missed. 3: a mutant timed out. 124: the run was cut short. 137: it was
          # killed, normally after ignoring the interrupt, though the OOM killer exits the same
          # way. Each is a result for the summary to report, not a failure of the job.
          case $status in
            0) ;;
            2|3) echo "cargo-mutants exited $status: see the summary" ;;
            124|137) echo "Stopped early (exit $status): the summary covers the mutants tested so far" \
                   | tee -a "$GITHUB_STEP_SUMMARY" ;;
            *) exit "$status" ;;
          esac

      - name: Summary
        if: ${{ !cancelled() && steps.diff.outputs.rust == 'true' }}
        env:
          OUTCOME: ${{ steps.mutants.outcome }}
        run: |
          out="$RUNNER_TEMP/mutants.out"
          count() { if [ -f "$out/$1.txt" ]; then wc -l < "$out/$1.txt"; else echo 0; fi; }
          {
            echo "### Mutation testing, shard ${{ matrix.shard }}/${{ strategy.job-total }}"
            if [ "$OUTCOME" != success ]; then
              echo "The run failed, so any counts below are partial: see the \`Run cargo mutants\` log."
            fi
            if [ ! -d "$out" ]; then
              if [ "$OUTCOME" = success ]; then
                echo "No mutants: the diff touches no code cargo-mutants can mutate."
              fi
              exit 0
            fi
            # A shard dealt no mutants still writes its (empty) list and exits 0.
            if [ -f "$out/mutants.json" ] && [ "$(jq length "$out/mutants.json")" = 0 ]; then
              echo "No mutants in this shard: the diff has too few to give every shard one."
              exit 0
            fi
            echo "| Caught | Missed | Timed out | Unviable |"
            echo "|---|---|---|---|"
            echo "| $(count caught) | $(count missed) | $(count timeout) | $(count unviable) |"
            if [ -s "$out/missed.txt" ]; then
              echo
              echo "Missed: add a test that fails on the mutant, or explain in the PR why it is"
              echo "equivalent to the original."
              echo '```'
              cat "$out/missed.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: cargo audit
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write  # audit-check reports any advisory or warning it finds as a check run
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      # NOTE: deliberately no `cargo generate-lockfile` step. `Cargo.lock` is committed, and
      # re-resolving it here would audit a graph that is not the one this repository ships --
      # exactly the question `deny.toml`'s RUSTSEC-2026-0097 exit criterion asks ("once `cargo
      # audit` against `Cargo.lock` stops reporting it"), which a re-resolved graph cannot answer.

      # Advisory ignores synced with deny.toml (canonical source for justifications)
      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Synced with deny.toml [advisories.ignore] - see that file for full justifications
          ignore: RUSTSEC-2026-0235,RUSTSEC-2025-0057,RUSTSEC-2024-0384,RUSTSEC-2025-0009,RUSTSEC-2025-0010,RUSTSEC-2025-0134,RUSTSEC-2026-0098,RUSTSEC-2026-0099,RUSTSEC-2026-0104,RUSTSEC-2026-0258,RUSTSEC-2026-0346,RUSTSEC-2026-0349

  deny:
    name: cargo deny
    needs: changes
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.code == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
