[package]
name = "rustrade-instrument"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/rustrade-instrument"
readme = "README.md"
description = "Core Rustrade Exchange, Instrument and Asset data structures and associated utilities."

# docs.rs documents the integration modules; `test-utils` is not part of the supported API.
[package.metadata.docs.rs]
features = ["ibkr", "hyperliquid"]

[features]
default = []
ibkr = ["dep:ibapi", "dep:fnv", "dep:parking_lot"]
hyperliquid = []
# Test fixtures (`test_utils`) for this crate's dependents' tests. Enable it under
# `[dev-dependencies]` only: the fixtures are not part of the supported API.
test-utils = []

[dev-dependencies]
rust_decimal_macros = { workspace = true }
serde_json = { workspace = true }

[dependencies]
# IBKR (optional, behind "ibkr" feature)
ibapi = { version = "=5.0.0", optional = true, default-features = false, features = ["sync"] }
fnv = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
# SerDe
serde = { workspace = true, features = ["derive"] }

# Data Structures
smol_str = { workspace = true, features = ["serde"]}
rust_decimal = { workspace = true }

# Misc
chrono = { workspace = true, features = ["serde"] }
derive_more = { workspace = true, features = ["display"] }
thiserror = { workspace = true }
