[package]
name = "rustrade-integration"
version = "0.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/rustrade-integration"
readme = "README.md"
description = "Low-level framework for composing flexible web integrations, especially with financial exchanges"

# `channel` and `metric` are not default features, so a default-feature docs.rs build would leave
# their modules out.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["collection", "error", "protocol", "serde", "subscription", "socket", "stream", "corporate-action"]
full = ["collection", "channel", "error", "metric", "protocol", "serde", "subscription", "socket", "stream", "corporate-action"]
collection = ["dep:indexmap", "dep:fnv", "dep:itertools", "dep:derive_more"]
# PULL corporate-action sourcing trait + filter. Needs `futures` (the `Stream` it returns), `chrono`
# (dates), `subscription` (smol_str symbol key), `rustrade-instrument` (descriptor), and
# `derive_more` for the `Constructor` derive on `CorporateActionFilter`. It uses no item of the
# `stream` module, so it lists those crates itself rather than enabling `stream`.
corporate-action = ["subscription", "dep:futures", "dep:chrono", "dep:rustrade-instrument", "dep:derive_more"]
channel = ["dep:tokio", "dep:tokio-stream", "dep:futures", "dep:derive_more", "dep:tracing"]
# `SocketError` wraps the errors of reqwest, tokio-tungstenite, serde_json and prost, and names
# `SubscriptionId`.
error = ["subscription", "dep:url", "dep:serde_qs", "dep:serde_urlencoded", "dep:thiserror", "dep:serde_json", "dep:prost", "dep:reqwest", "dep:tokio-tungstenite"]
metric = []
protocol = ["error", "metric", "serde", "subscription", "dep:futures", "dep:tokio-tungstenite", "dep:reqwest", "dep:hmac", "dep:hex", "dep:base64", "dep:tokio", "dep:chrono", "dep:bytes", "dep:tracing"]
serde = ["dep:serde_json", "dep:prost", "dep:bytes", "dep:thiserror", "dep:tracing", "dep:chrono"]
subscription = ["dep:smol_str"]
socket = ["dep:tokio", "dep:pin-project", "dep:futures"]
# `stream::ExchangeStream` parses protocol messages, so it also needs `protocol`; without it the
# rest of the module (extensions, merge, data) builds on these alone.
stream = ["dep:tokio-stream", "dep:pin-project", "dep:futures", "dep:chrono"]

[dev-dependencies]
tokio-test = { workspace = true }
sha2 = { workspace = true }
wiremock = { workspace = true }

[dependencies]
# Rustrade Ecosystem
rustrade-instrument = { workspace = true, optional = true }

# Logging
tracing = { workspace = true, optional = true }

# SerDe
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
serde_qs = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }

# Error
thiserror = { workspace = true, optional = true }

# Async
tokio = { workspace = true, optional = true, features = [
    "net",
    "sync",
    "macros",
    "rt-multi-thread",
] }
tokio-stream = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
pin-project = { workspace = true, optional = true }

# Data Structures
indexmap = { workspace = true, optional = true, features = ["serde"] }
fnv = { workspace = true, optional = true }
smol_str = { workspace = true, optional = true, features = ["serde"] }

# Protocol
tokio-tungstenite = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }

# Cryptographic Signatures
hmac = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

# Misc
chrono = { workspace = true, optional = true, features = ["serde"] }
itertools = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
derive_more = { workspace = true, optional = true, features = ["display", "constructor"] }
prost = { workspace = true, optional = true }
